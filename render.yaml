services:
  - type: web
    name: discord-gif-bot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_GIF_MB
        value: "10"
      - key: MAX_VIDEO_SECONDS
        value: "10"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
